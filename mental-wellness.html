.sec-lbl{font-size:10px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);padding:12px 16px 5px}.sec-lbl.ag{color:#7c3aed}.tool-btn{display:block;width:100%;text-align:left;padding:7px 16px;background:none;border:none;cursor:pointer;font-size:12px;font-family:inherit;color:var(--mid);line-height:1.4;transition:background .12s,color .12s}.tool-btn:hover{background:var(--bg);color:var(--dark)}.tool-btn.active{background:var(--blue-light);color:var(--blue);font-weight:600}.tool-btn.agent:hover{background:rgba(124,58,237,.06);color:#5b21b6}.tool-btn.agent.active{background:rgba(124,58,237,.1);color:#5b21b6;font-weight:600}
.content{overflow-y:auto;background:var(--bg);padding:32px}.tool-header{margin-bottom:24px}.tool-name{font-size:20px;font-weight:700;color:var(--dark);letter-spacing:-.3px;margin-bottom:5px}.tool-desc{font-size:13px;color:var(--muted);line-height:1.6}.form-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:24px;display:flex;flex-direction:column;gap:18px}.field-group{display:flex;flex-direction:column;gap:6px}.field-label{font-size:12px;font-weight:600;color:var(--mid)}.field-opt{font-weight:400;color:var(--muted)}
input[type=text],select,textarea{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--rsm);font-size:13px;font-family:inherit;color:var(--dark);background:var(--white);outline:none;transition:border-color .15s,box-shadow .15s}input[type=text]:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.08)}textarea{resize:vertical;line-height:1.6}.btn-upload{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;background:var(--white);border:1px solid var(--border);border-radius:6px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit;transition:all .15s;margin-top:2px}.btn-upload:hover{border-color:var(--blue);color:var(--blue)}.btn-upload input{display:none}.output-box{white-space:normal}.output-box.streaming{white-space:pre-wrap}.output-box h1,.output-box h2,.output-box h3,.output-box h4{font-weight:700;color:var(--dark)}.output-box h1{font-size:16px;margin:0 0 8px}.output-box h2{font-size:14px;margin:14px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--border)}.output-box h3{font-size:13px;margin:12px 0 5px}.output-box h4{font-size:13px;margin:10px 0 4px;color:var(--mid)}.output-box p{margin:0 0 10px;line-height:1.7}.output-box p:last-child{margin-bottom:0}.output-box ul,.output-box ol{padding-left:20px;margin:0 0 10px}.output-box li{margin-bottom:4px;line-height:1.6}.output-box strong{font-weight:600}.output-box em{font-style:italic;color:var(--mid)}.output-box table{width:100%;border-collapse:collapse;margin:0 0 12px;font-size:12px}.output-box th{background:var(--bg);font-weight:600;padding:7px 10px;border:1px solid var(--border);text-align:left}.output-box td{padding:6px 10px;border:1px solid var(--border);vertical-align:top}.output-box tr:nth-child(even) td{background:#fafbfc}.output-box code{background:var(--bg);border:1px solid var(--border);border-radius:3px;padding:1px 5px;font-size:11px;font-family:monospace}.output-box pre{background:var(--bg);border:1px solid var(--border);border-radius:var(--rsm);padding:14px;overflow-x:auto;margin:0 0 12px}.output-box pre code{background:none;border:none;padding:0}.output-box blockquote{border-left:3px solid #93c5fd;padding:8px 14px;color:var(--muted);margin:0 0 12px;background:var(--blue-light);border-radius:0 6px 6px 0}.output-box hr{border:none;border-top:1px solid var(--border);margin:14px 0}.btn-dl{padding:4px 12px;background:var(--white);border:1px solid var(--border);border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;color:var(--muted);font-family:inherit;transition:all .15s}.btn-dl:hover{border-color:var(--blue);color:var(--blue)}.sidebar-search{padding:8px 16px 10px;border-bottom:1px solid var(--border);flex-shrink:0}.search-inp{width:100%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;font-family:inherit;outline:none;color:var(--dark);background:var(--bg);transition:border-color .15s}.search-inp:focus{border-color:var(--blue)}.tool-btn.hidden{display:none}@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}.dots span{animation:blink 1.2s infinite;display:inline-block;margin:0 1px}.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}.out-empty{text-align:center;padding:36px 20px;color:var(--muted)}.out-empty-icon{font-size:24px;margin-bottom:8px}.out-empty p{font-size:12px;line-height:1.6}.btn-gen{align-self:stretch}
.btn-gen{padding:10px 22px;background:var(--blue);color:#fff;border:none;border-radius:var(--rsm);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;transition:opacity .15s;align-self:flex-start}.btn-gen:hover{opacity:.88}.btn-gen:disabled{opacity:.5;cursor:not-allowed}.output-section{margin-top:20px}.output-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.output-lbl{font-size:12px;font-weight:600;color:var(--mid)}.btn-copy{padding:4px 12px;background:var(--white);border:1px solid var(--border);border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;color:var(--muted);font-family:inherit;transition:all .15s}.btn-copy:hover{border-color:var(--blue);color:var(--blue)}.output-box{background:var(--white);border:1px solid var(--border);border-radius:var(--rsm);padding:20px;font-size:13px;line-height:1.75;color:var(--dark);white-space:pre-wrap;min-height:180px;overflow-y:auto;font-family:inherit}

<script>
const DOMAIN={name:'Mental Wellness',icon:'🧠',tools:[
{id:'affirmation-gen',name:'Daily Affirmation Generator',description:'Generates personalised affirmations based on current emotional state and goals.',fields:[{id:'state',label:'Current Emotional State',type:'text',placeholder:'e.g. Anxious about work, feeling low energy, stressed about finances',required:true},{id:'goals',label:'What You Need Support With',type:'textarea',placeholder:'e.g. Building confidence, staying motivated, managing anxiety, feeling worthy…',rows:3,required:true},{id:'count',label:'Number of Affirmations',type:'select',options:['5','7','10','15'],required:true}],
systemPrompt:`You are a compassionate wellness coach specialising in positive psychology and affirmations. Create personalised, meaningful affirmations.

⚠️ These tools support general wellbeing. For mental health concerns, please speak with a qualified professional.

Guidelines:
- Affirmations should be present tense ("I am", "I have", "I choose")
- Specific to the person's stated situation — not generic
- Believable and realistic — not toxic positivity
- Target both the emotional state and the goal
- Mix of self-compassion, strength, and forward-looking statements
- Avoid: "Everything is perfect" (dismissive) — prefer: "I am learning to..."

Format:
## Your Personalised Affirmations

### Morning Affirmations (read on waking)
1. [Affirmation]
*Why this works for you:* [Brief note on why this affirmation addresses their specific situation]

### During the Day (when you need a reset)
[3-4 shorter affirmations to repeat in moments of stress]

### Evening Affirmations (before sleep)
[2-3 affirmations focused on self-compassion and rest]

### Your Core Affirmation
[One powerful statement that encapsulates their growth — make this memorable]

### How to Use These
[Brief practical guide on making affirmations work]`,
buildUserMessage:f=>`Create ${f.count} personalised affirmations.\nEmotional state: ${f.state}\nNeeds: ${f.goals}`},

{id:'gratitude-prompts',name:'Gratitude Journal Prompt Generator',description:'Creates guided gratitude prompts tailored to the user\'s context and mood.',fields:[{id:'mood',label:'Current Mood',type:'select',options:['Low / Struggling','Neutral / Okay','Good','Excellent'],required:true},{id:'context',label:'What\'s Going On in Your Life',type:'textarea',placeholder:'Brief context — what\'s on your mind, any challenges or good things happening…',rows:3,required:true},{id:'depth',label:'Journaling Depth',type:'select',options:['Quick (5 min)','Medium (15 min)','Deep reflection (30 min)'],required:true}],
systemPrompt:`You are a mindfulness and journaling coach. Create thoughtful, personalised gratitude journal prompts.

⚠️ Journaling supports wellbeing but is not a replacement for professional mental health care.

Format:
## Your Gratitude Journal — [Date placeholder]

### Starting Check-in
"Before I begin, I acknowledge that today I feel ___. And that's okay."

### Warm-up Prompt
[Easy, gentle opening prompt to ease into the practice]

### Core Gratitude Prompts
For each prompt:
**[N]. [Prompt]**
*Go deeper:* [Follow-up question to explore further]

Include a mix of:
- People gratitude
- Situation gratitude (even from difficulty)
- Self-gratitude
- Sensory/present-moment gratitude
- Future gratitude (anticipatory)

### Reflection Prompt
[A prompt to synthesise the session]

### Closing Intention
"Today I intend to ___."

### For When Gratitude Feels Hard
[Special prompts for when the person is in a low mood — acknowledging that gratitude can feel forced, and offering gentler entry points]`,
buildUserMessage:f=>`Create gratitude journal prompts.\nMood: ${f.mood}\nDepth: ${f.depth}\nContext: ${f.context}`},

{id:'stress-tips',name:'Stress Management Tip Generator',description:'Suggests practical, evidence-based techniques for managing specific stressors.',fields:[{id:'stressor',label:'Source of Stress',type:'textarea',placeholder:'What specifically is causing stress — be as detailed as you like…',rows:4,required:true},{id:'intensity',label:'Stress Intensity',type:'select',options:['Mild (manageable)','Moderate (affecting daily life)','High (overwhelming)'],required:true},{id:'constraints',label:'Your Constraints',type:'textarea',placeholder:'Time, location, what you\'ve already tried, any health conditions…',rows:2,required:false}],
systemPrompt:`You are a stress management coach with expertise in evidence-based techniques. Provide personalised, practical stress management guidance.

⚠️ For persistent or severe stress, please consider speaking with a mental health professional.

Format:
## Stress Management Guide — Personalised for You

### Understanding Your Stress
[Brief, validating acknowledgment of what they're dealing with — no toxic positivity]

### Immediate Relief (Right Now — Under 5 Minutes)
1. **[Technique]** — [Exact steps]
   *Why it works:* [Brief science explanation]
   *How to do it:* [Step-by-step instructions]

### Short-term Strategies (This Week)
[3-4 practical, specific strategies for the specific stressor]

### Addressing the Root Cause
[Honest analysis of the stressor and strategies to address the underlying cause, not just symptoms]

### Body-Based Techniques
[Physical practices: breathing, movement, sleep, nutrition specific to stress response]

### Mind-Based Techniques
[Cognitive reframing approaches for this specific situation]

### Building Resilience (Over Time)
[2-3 habits to build stress resilience long-term]

### When to Seek Help
[Clear guidance on when these tools aren't enough]`,
buildUserMessage:f=>`Provide stress management guidance.\nStressor: ${f.stressor}\nIntensity: ${f.intensity}${f.constraints?'\nConstraints: '+f.constraints:''}`},

{id:'mindfulness-exercise',name:'Mindfulness Exercise Generator',description:'Produces guided mindfulness exercises for different durations and situations.',fields:[{id:'duration',label:'Duration',type:'select',options:['2-3 minutes','5 minutes','10 minutes','15-20 minutes'],required:true},{id:'situation',label:'Situation',type:'select',options:['Morning wake-up','Work break / desk','Before a stressful event','After a difficult conversation','Evening wind-down','Before sleep','Feeling anxious','Feeling overwhelmed','General practice'],required:true},{id:'style',label:'Mindfulness Style',type:'select',options:['Breath-focused','Body scan','Visualisation','Loving-kindness','Open awareness','Grounding (5 senses)'],required:true}],
systemPrompt:`You are a certified mindfulness instructor. Write a complete, guided mindfulness exercise.

Format:
## [Style] — [Duration] Guided Practice
*For: [Situation]*

---

[Write the exercise as a complete guided script, as if narrating it in person]

Use:
- Second person ("Now bring your attention to...")
- Short sentences and natural pauses (indicate with [pause] or ...)
- Warm, calm, non-prescriptive language
- Progression from settling → focus → deepening → returning
- Clear opening (how to begin) and closing (how to end the practice)

Structure:
**Setting Up** (1 min)
[Finding position, closing eyes, arriving]

**[Main Practice Name]** ([duration])
[Full guided script]

**Returning** (1 min)
[Gentle return to the room]

**Reflection**
One question to sit with after the practice.

End with:
**Carry this with you:** [One micro-practice to take into the rest of the day]`,
buildUserMessage:f=>`Create a ${f.duration} ${f.style} mindfulness exercise for: ${f.situation}`},

{id:'cbt-worksheet',name:'CBT Worksheet Generator',description:'Creates structured cognitive behavioural therapy worksheets for common thought patterns.',fields:[{id:'thought_pattern',label:'Thought Pattern or Challenge',type:'select',options:['Catastrophising / worst-case thinking','All-or-nothing thinking','Mind reading','Negative self-talk','Rumination','Anxiety about future events','Imposter syndrome','Perfectionism'],required:true},{id:'situation',label:'Specific Situation',type:'textarea',placeholder:'Describe the specific situation or thought you want to work through…',rows:4,required:true}],
systemPrompt:`You are a CBT-trained therapist. Create a structured, therapeutic CBT worksheet.

⚠️ CBT worksheets support self-help but do not replace therapy. If you're struggling significantly, please seek professional support.

Format:
## CBT Worksheet — [Thought Pattern]

### Understanding [Thought Pattern]
[Brief psychoeducation: what this pattern is, why our brain does it, and why it's not serving us]

### Step 1: Identify the Thought
**Situation:** [Describe what happened]
**Automatic thought:** [The thought that came up]
**Emotion(s):** [What you felt] — Intensity: ___/10

### Step 2: Examine the Evidence
| Evidence FOR this thought | Evidence AGAINST this thought |
[User fills in — provide guidance on what to look for]

### Step 3: Challenge the Thought
**[Guided questions specific to their thought pattern]**
1. [Socratic question]
2. [Reality-testing question]
3. [Perspective-shifting question]

### Step 4: Develop a Balanced Thought
"A more balanced way to see this is: ___"
[Template and example]

### Step 5: Emotion Check
After completing this exercise:
Emotion(s): [Same emotions] — New Intensity: ___/10

### Behavioural Experiment (optional)
[A small real-world action to test the balanced thought]

### For Your Journal
[3 reflection questions to explore further]`,
buildUserMessage:f=>`Create a CBT worksheet.\nPattern: ${f.thought_pattern}\nSituation: ${f.situation}`},

{id:'self-care-plan',name:'Self-Care Plan Generator',description:'Builds a personalised self-care routine based on lifestyle and wellness goals.',fields:[{id:'lifestyle',label:'Your Lifestyle',type:'textarea',placeholder:'Work schedule, family situation, typical stress levels, energy patterns…',rows:3,required:true},{id:'needs',label:'What You Most Need Right Now',type:'textarea',placeholder:'More rest, social connection, movement, creative outlets, quietude…',rows:3,required:true},{id:'barriers',label:'What Gets in the Way',type:'textarea',placeholder:'Time, energy, guilt, not knowing where to start…',rows:2,required:false}],
systemPrompt:`You are a holistic wellness coach. Create a personalised, realistic self-care plan.

Format:
## Your Self-Care Plan

### Your Self-Care Assessment
[Honest look at current self-care gaps and what matters most for this person]

### Your Self-Care Pillars
[3-4 personalised pillars based on their specific needs, not generic categories]

### Daily Micro-Practices (5-15 min each)
[Small, doable daily acts of self-care specific to their lifestyle]
- Morning: [Practice — time]
- During day: [Practice — time]
- Evening: [Practice — time]

### Weekly Practices (30-60 min)
[Deeper self-care practices once or twice a week]

### Monthly / As Needed
[Bigger recharge practices]

### Your Non-Negotiables
[2-3 core practices that should never be the first thing to drop]

### Overcoming Your Specific Barriers
[Address their stated barriers with specific strategies]

### Self-Care Emergency Kit
[When you're at your lowest — 5 quick things to do right now]

### Self-Care Check-in
Weekly questions to assess your self-care:
1. [Question]

### Permission Statement
"I give myself permission to ___"
[A personalised permission statement addressing their specific patterns]`,
buildUserMessage:f=>`Create a self-care plan.\nLifestyle: ${f.lifestyle}\nNeeds: ${f.needs}${f.barriers?'\nBarriers: '+f.barriers:''}`},

{id:'coping-strategies',name:'Coping Strategy Recommender',description:'Suggests personalised coping strategies based on the situation and emotional state.',fields:[{id:'situation',label:'Situation / Challenge',type:'textarea',placeholder:'What are you dealing with right now? Be as specific as you like…',rows:4,required:true},{id:'emotion',label:'Primary Emotion',type:'select',options:['Anxiety / Worry','Sadness / Low mood','Anger / Frustration','Overwhelm','Loneliness','Grief','Shame / Guilt','Fear','Numbness'],required:true},{id:'capacity',label:'Current Capacity',type:'select',options:['Very low — barely functioning','Low — managing but struggling','Medium — doing okay','Good — looking to grow'],required:true}],
systemPrompt:`You are a compassionate mental health coach. Recommend personalised, evidence-based coping strategies.

⚠️ These are supportive strategies, not professional treatment. Seek help if you're in crisis.

**If someone seems in crisis, always include the crisis line: iCall: 9152987821 (India) | Mind: 0300 123 3393 (UK) | NIMHANS: 080-46110007**

Format:
## Coping Strategies — Personalised for You

### Acknowledging Where You Are
[Validation of their experience — not dismissal, not excessive positivity]

### Right Now (0-5 minutes)
[Immediate, body-based regulation techniques for the specific emotion]
**[Technique]:**
[Exact steps — detailed enough to follow immediately]

### Today (Activities and practices for the rest of the day)
[3-4 specific, capacity-appropriate coping actions]

### This Week (Ongoing strategies)
[Longer-term strategies addressing the specific situation]

### Reframing Approaches
[Cognitive approaches specifically helpful for their emotion]

### What to Avoid
[Coping strategies that feel helpful but make things worse for this emotion]

### Reach Out
[Guidance on when and how to reach out for support]

### Your Personalised Coping Toolkit
[A shortlist of 5 go-to strategies matched to this person]`,
buildUserMessage:f=>`Recommend coping strategies.\nEmotion: ${f.emotion}\nCapacity: ${f.capacity}\nSituation: ${f.situation}`},

{id:'sleep-hygiene',name:'Sleep Hygiene Guide Generator',description:'Produces a tailored sleep improvement plan based on current habits and challenges.',fields:[{id:'challenges',label:'Sleep Challenges',type:'textarea',placeholder:'What specifically is the issue — trouble falling asleep, waking at night, early waking, feeling unrested, racing mind…',rows:4,required:true},{id:'habits',label:'Current Sleep Habits',type:'textarea',placeholder:'Bedtime, wake time, screen use, caffeine, exercise timing, bedroom environment…',rows:3,required:true},{id:'context',label:'Context',type:'textarea',placeholder:'Stress levels, life stage (shift work, parenting, etc.), how long this has been happening…',rows:2,required:false}],
systemPrompt:`You are a sleep coach and CBT-I specialist. Create a personalised sleep improvement plan.

⚠️ For persistent sleep disorders, consult a doctor. This is general guidance.

Format:
## Personalised Sleep Improvement Plan

### Your Sleep Analysis
[Assessment of what's likely causing the specific issues — connect habits to problems]

### Your Sleep Foundation
**Target bedtime:** ___
**Target wake time:** ___
**Sleep window:** ___ hours
*Why this window for you:* [Explanation]

### The Sleep Hygiene Reset

**Evening Routine (2 hours before bed):**
[Time-stamped wind-down routine specific to their challenges]

**Bedroom Environment:**
[Specific adjustments needed — light, temperature, noise, devices]

**Daytime Habits:**
[What to change during the day to improve night sleep]

### Addressing Your Specific Challenges
For each stated challenge:
**[Challenge]:** [Targeted strategy with evidence basis]

### The 2-Week Sleep Reset Plan
Week 1: [Focus and changes]
Week 2: [Build on Week 1]

### When Your Mind Won't Quiet
[Specific techniques for racing thoughts at bedtime]

### Sleep Journal Template
[Simple nightly log to track progress]

### What to Expect
[Realistic timeline for improvement — managing expectations]`,
buildUserMessage:f=>`Create a sleep improvement plan.\nChallenges: ${f.challenges}\nCurrent Habits: ${f.habits}${f.context?'\nContext: '+f.context:''}`},

{id:'boundary-scripts',name:'Boundary Setting Script Generator',description:'Writes scripts for setting boundaries in specific personal or professional situations.',fields:[{id:'situation',label:'Situation',type:'textarea',placeholder:'Describe the specific situation where you need to set a boundary — who, what, what keeps happening…',rows:4,required:true},{id:'relationship',label:'Type of Relationship',type:'select',options:['Manager / Employer','Colleague','Family member','Friend','Partner / Spouse','Client','Acquaintance / Stranger'],required:true},{id:'style',label:'Communication Style',type:'select',options:['Gentle and diplomatic','Direct and clear','Firm and assertive'],required:true}],
systemPrompt:`You are an assertiveness coach and communication specialist. Write practical boundary-setting scripts.

Format:
## Boundary Setting — [Situation Type]

### Understanding This Situation
[Brief validation and framing — why this boundary is reasonable and important]

### The Core Boundary Statement
**Template:** "When [situation], I feel [impact]. I need [specific request]."
**Your personalised version:** [Fill in with their specific details]

### Full Scripts

**In Person / On a Call:**
"[Opening — don't apologise for the boundary]
[State the boundary clearly]
[Acknowledge their perspective briefly if needed]
[Restate what you need]
[Closing that keeps the door open if appropriate]"

**Via Message / Email:**
Subject: [If email]
[Written version — more formal, clear, documented]

### Handling Pushback

**If they say "You're being too sensitive":**
"[Response script]"

**If they push back or try to negotiate the boundary:**
"[Firm but calm response]"

**If they get angry:**
"[De-escalation + hold your ground script]"

### After Setting the Boundary
[What to expect, how to follow through if the boundary is violated]

### Self-Care After
[Because boundary setting is emotionally taxing — brief self-care note]`,
buildUserMessage:f=>`Write boundary setting scripts.\nRelationship: ${f.relationship}\nStyle: ${f.style}\nSituation: ${f.situation}`},

{id:'therapy-prep',name:'Therapy Session Prep Guide',description:'Helps users organise thoughts and prepare topics before a therapy appointment.',fields:[{id:'session_type',label:'Session Type',type:'select',options:['First session ever','Ongoing therapy','After a difficult period','After a long break','Specific issue to address'],required:true},{id:'themes',label:'What\'s Been on Your Mind',type:'textarea',placeholder:'What\'s been happening, what you\'ve been thinking about, what you want to explore…',rows:5,required:true},{id:'last_session',label:'From Last Session (if applicable)',type:'textarea',placeholder:'What was discussed, homework given, anything unresolved…',rows:3,required:false}],
systemPrompt:`You are a therapy support specialist. Help the person prepare for a productive therapy session.

Format:
## Therapy Session Prep

/* PS Tools API base — configurable. Default :8000; override via ?api=http://host:port (persists in localStorage). */
const _psApiQp=new URLSearchParams(location.search).get('api');
if(_psApiQp)localStorage.setItem('ps_api_base',_psApiQp);
const API_BASE=(_psApiQp||localStorage.getItem('ps_api_base')||'http://localhost:8000').replace(/\/$/,'');
const API_GENERATE=API_BASE+'/generate';
function selectTool(id) {
  const tool = DOMAIN.tools.find(t => t.id === id);
  if (!tool) return;
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.toggle('active', b.dataset.id === id));
  renderTool(tool);
}

function renderTool(tool) {
  const fieldsHtml = tool.fields.map(f => {
    let inp = '';
    if (f.type === 'text')
      inp = `<input type="text" id="f_${f.id}" placeholder="${f.placeholder||''}"${f.required?' required':''}>`;
    else if (f.type === 'textarea')
      inp = `<textarea id="f_${f.id}" placeholder="${f.placeholder||''}" rows="${f.rows||4}"${f.required?' required':''}></textarea><label class="btn-upload"><input type="file" accept=".txt,.pdf,.docx" onchange="handleFileUpload('f_${f.id}',this)">📎 Upload file</label>`;
    else if (f.type === 'select')
      inp = `<select id="f_${f.id}">${f.options.map(o=>`<option>${o}</option>`).join('')}</select>`;
    return `<div class="field-group"><label class="field-label" for="f_${f.id}">${f.label}${f.required?'':' <span class="field-opt">(optional)</span>'}</label>${inp}</div>`;
  }).join('');

  document.getElementById('content').innerHTML = `
    <div class="tool-header">
      <h2 class="tool-name">${tool.name}</h2>
      <p class="tool-desc">${tool.description}</p>
    </div>
    <div class="form-card">
      ${fieldsHtml}
      <button class="btn-gen" onclick="runGenerate('${tool.id}')">Generate</button>
    </div>
    <div class="output-section" id="out-section">
      <div class="output-header"><span class="output-lbl">Output</span><div style="display:flex;gap:6px"><button class="btn-dl" onclick="downloadOut()">↓ Save</button><button class="btn-copy" onclick="copyOut()">Copy</button></div></div>
      <div class="output-box" id="out-box"><div class="out-empty"><div class="out-empty-icon">✨</div><p>Fill in the form and click Generate.</p></div></div>
    </div>`;
}

async function runGenerate(toolId) {
  const tool = DOMAIN.tools.find(t => t.id === toolId);
  if (!tool) return;
  const data = {};
  let ok = true;
  for (const f of tool.fields) {
    const el = document.getElementById(`f_${f.id}`);
    if (!el) continue;
    const v = el.value.trim();
    if (f.required && !v) { el.style.borderColor = '#ef4444'; ok = false; } else { el.style.borderColor = ''; data[f.id] = v; }
  }
  if (!ok) return;

  const outBox = document.getElementById('out-box');
  const btn = document.querySelector('.btn-gen');
  outBox.classList.add('streaming');
  outBox.innerHTML = '<span style="color:var(--muted)">Generating<span class="dots"><span>.</span><span>.</span><span>.</span></span></span>';
  btn.disabled = true; btn.textContent = 'Generating…';

  try {
    const res = await fetch(API_GENERATE, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({system_prompt: tool.systemPrompt, user_message: tool.buildUserMessage(data)})
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const reader = res.body.getReader(); const dec = new TextDecoder(); let out = '';
    outBox.textContent = '';
    while (true) {
      const {done, value} = await reader.read(); if (done) break;
      for (const line of dec.decode(value).split('\n')) {
        if (!line.startsWith('data: ')) continue;
        const d = line.slice(6); if (d === '[DONE]') break;
        try { const p = JSON.parse(d); if (p.error) { outBox.classList.remove('streaming'); outBox.style.color='#ef4444'; outBox.textContent='Error: '+p.error; } else if (p.text) { out += p.text; outBox.textContent = out; outBox.scrollTop = outBox.scrollHeight; } } catch {}
      }
    }
    if (out && typeof marked !== 'undefined') { outBox.classList.remove('streaming'); outBox.innerHTML = marked.parse(out); } else { outBox.classList.remove('streaming'); }
  } catch(e) {
    outBox.classList.remove('streaming');
    outBox.style.color = '#ef4444';
    outBox.textContent = `Connection error: ${e.message}\n\nStart the backend:\n  cd backend\n  uvicorn main:app --reload`;
  }
  btn.disabled = false; btn.textContent = 'Generate';
}

function copyOut() {
  const text = document.getElementById('out-box')?.innerText;
  if (!text || text.includes('Fill in the form')) return;
  navigator.clipboard.writeText(text).then(() => { const b = document.querySelector('.btn-copy'); b.textContent='Copied!'; setTimeout(()=>b.textContent='Copy',2000); });
}

function init() {
  const tools = DOMAIN.tools.filter(t => !t.isAgent);
  const agents = DOMAIN.tools.filter(t => t.isAgent);
  document.getElementById('tool-list').innerHTML =
    `<div class="sidebar-search"><input class="search-inp" type="text" placeholder="Search tools…" oninput="filterTools(this.value)"></div>` +
    `<div class="sec-lbl">Tools · ${tools.length}</div>` +
    tools.map(t=>`<button class="tool-btn" data-id="${t.id}" onclick="selectTool('${t.id}')">${t.name}</button>`).join('') +
    (agents.length ? `<div class="sec-lbl ag">Agents · ${agents.length}</div>` + agents.map(t=>`<button class="tool-btn agent" data-id="${t.id}" onclick="selectTool('${t.id}')">${t.name}</button>`).join('') : '');
  if (tools.length) selectTool(tools[0].id);
}
function filterTools(q) {
  const lq = q.toLowerCase();
  document.querySelectorAll('.tool-btn').forEach(b => {
    b.classList.toggle('hidden', !b.textContent.toLowerCase().includes(lq));
  });
}
function downloadOut() {
  const text = document.getElementById('out-box')?.innerText;
  if (!text || text.includes('Fill in the form')) return;
  const a = document.createElement('a');
  a.href = 'data:text/plain;charset=utf-8,' + encodeURIComponent(text);
  a.download = 'output.txt'; a.click();
}
async function handleFileUpload(fieldId, input) {
  const file = input.files[0]; if (!file) return;
  const ext = file.name.split('.').pop().toLowerCase();
  const ta = document.getElementById(fieldId);
  const prev = ta.placeholder; ta.placeholder = 'Reading file…'; ta.disabled = true;
  try {
    if (ext === 'txt' || ext === 'md' || ext === 'csv') {
      ta.value = await file.text();
    } else if (ext === 'pdf') {
      if (typeof pdfjsLib === 'undefined') { alert('PDF library not loaded yet, please retry.'); ta.disabled = false; ta.placeholder = prev; return; }
      const buf = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({data: new Uint8Array(buf)}).promise;
      let text = '';
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        text += content.items.map(item => item.str).join(' ') + '\n\n';
      }
      ta.value = text.trim();
    } else if (ext === 'docx') {
      if (typeof mammoth === 'undefined') { alert('DOCX library not loaded yet, please retry.'); ta.disabled = false; ta.placeholder = prev; return; }
      const buf = await file.arrayBuffer();
      const result = await mammoth.extractRawText({arrayBuffer: buf});
      ta.value = result.value;
    }
  } catch(e) { alert('Could not read file: ' + e.message); }
  ta.disabled = false; ta.placeholder = prev; input.value = '';
}
window.addEventListener('DOMContentLoaded',init);
</script>
