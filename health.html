<script>
const DOMAIN={name:'Health',icon:'🏥',tools:[
{id:'symptom-checker',name:'Symptom Checker',description:'Describes possible causes for reported symptoms with clear medical disclaimers.',fields:[{id:'symptoms',label:'Symptoms',type:'textarea',placeholder:'Describe your symptoms in detail — what, where, when, duration, severity…',rows:5,required:true},{id:'age',label:'Age & Sex',type:'text',placeholder:'e.g. 34, Female',required:true},{id:'history',label:'Relevant Medical History',type:'textarea',placeholder:'Any existing conditions, medications, recent events…',rows:3,required:false}],
systemPrompt:`You are a health information assistant. Provide educational information about possible causes for reported symptoms.

⚠️ IMPORTANT: Always include the disclaimer below. This is not medical advice.

Format:
## Symptom Analysis — Educational Information

⚠️ **Medical Disclaimer:** This information is for educational purposes only and is not a substitute for professional medical advice, diagnosis, or treatment. Please consult a qualified healthcare provider for any medical concerns.

### Symptoms Reported
[Summary of what was reported]

### Possible Explanations
For each possible cause (list 3-5, most common first):
**[Condition Name]**
- Why it might fit: [How symptoms align]
- Other typical symptoms: [What else usually accompanies this]
- Urgency level: [Routine / See doctor soon / Urgent care / Emergency]

### When to Seek Immediate Care
🚨 Go to emergency care if you experience: [Red flag symptoms]

### Recommended Next Steps
1. [Practical step]

### Questions to Ask Your Doctor
• [Specific questions to raise]

Always recommend seeing a healthcare professional.`,
buildUserMessage:f=>`Provide symptom information.\nAge/Sex: ${f.age}\nSymptoms: ${f.symptoms}${f.history?'\nMedical History: '+f.history:''}`},

{id:'health-report-simplifier',name:'Health Report Simplifier',description:'Translates complex medical reports and lab results into plain English.',fields:[{id:'report',label:'Medical Report / Lab Results',type:'textarea',placeholder:'Paste the medical report text, lab values, or scan results here…',rows:8,required:true}],

Format:
## Report Summary in Plain English

⚠️ This explanation is for general understanding only. Discuss all results with your doctor.

### What This Report/Test Is For
[Simple explanation of what was being assessed]

### Your Results — Plain English
For each finding/value:
**[Test/Finding Name]:** [Value]
- What it means: [Plain language explanation]
- Your result vs normal range: [Normal / Slightly above/below / Significantly outside range]
- What this might indicate: [Simple explanation — not diagnosis]

### What Looks Normal
✓ [Normal findings listed]

### What Your Doctor Will Likely Discuss
• [Findings outside normal range or noteworthy]

### Questions to Ask Your Doctor
1. [Specific question about a finding]

### Glossary of Medical Terms Used
[Define any medical jargon in the report]`,
buildUserMessage:f=>`Explain this medical report in plain English.\n\n${f.report}`},

{id:'nutrition-plan',name:'Nutrition Plan Generator',description:'Creates personalised meal plans based on dietary goals, restrictions, and preferences.',fields:[{id:'goal',label:'Health / Dietary Goal',type:'select',options:['Weight loss','Weight gain / muscle building','Maintain weight','Manage diabetes','Heart health','Improve energy','General healthy eating'],required:true},{id:'restrictions',label:'Dietary Restrictions',type:'textarea',placeholder:'e.g. Vegetarian, lactose intolerant, no nuts, diabetic, religious restrictions…',rows:2,required:false},{id:'preferences',label:'Food Preferences & Dislikes',type:'textarea',placeholder:'Foods you like and dislike, cuisine preferences, cooking ability…',rows:2,required:false},{id:'calories',label:'Target Calories (if known)',type:'text',placeholder:'e.g. 1800 kcal, or leave blank for a recommendation',required:false}],

Format:
## Personalised Nutrition Plan

### Your Profile
Goal: | Restrictions: | Approx. calories: [X]/day

### Daily Nutritional Targets
| Nutrient | Daily Target | Why |
[Calories, protein, carbs, fat, fibre, key vitamins]

Snack:
Dinner:

### Meal Prep Tips
• [Practical tips to make this sustainable]

### Foods to Emphasise & Limit
✓ Emphasise: [list]
⚠️ Limit: [list]`,
buildUserMessage:f=>`Create a nutrition plan.\nGoal: ${f.goal}${f.restrictions?'\nRestrictions: '+f.restrictions:''}${f.preferences?'\nPreferences: '+f.preferences:''}${f.calories?'\nTarget Calories: '+f.calories:''}`},

{id:'medication-schedule',name:'Medication Schedule Generator',description:'Produces a clear daily medication schedule from a list of prescriptions.',fields:[{id:'medications',label:'Medications List',type:'textarea',placeholder:'List each medication:\nName, dosage, frequency, special instructions\ne.g. Metformin 500mg — twice daily with meals\nAtorvastatin 10mg — once at night',rows:8,required:true}],

## Daily Medication Schedule

buildUserMessage:f=>`Create a medication schedule for:\n${f.medications}`},

{id:'wellness-checkin',name:'Wellness Check-in Questionnaire',description:'Generates personalised wellness surveys to track health habits over time.',fields:[{id:'focus',label:'Wellness Focus Area',type:'select',options:['Overall health & lifestyle','Physical fitness','Sleep quality','Nutrition & diet','Mental wellbeing','Chronic condition management','Work-life balance'],required:true},{id:'context',label:'Individual Context',type:'textarea',placeholder:'Age, lifestyle, specific concerns or goals…',rows:3,required:false}],

{id:'appointment-prep',name:'Medical Appointment Prep Guide',description:'Prepares patients with questions and information to bring to a doctor\'s visit.',fields:[{id:'reason',label:'Reason for Visit',type:'textarea',placeholder:'Why are you seeing the doctor — symptoms, follow-up, specific concern…',rows:4,required:true},{id:'doctor_type',label:'Doctor Type',type:'text',placeholder:'e.g. GP, Cardiologist, Endocrinologist, Gynaecologist',required:true},{id:'history',label:'Relevant History',type:'textarea',placeholder:'Current medications, conditions, recent changes, family history of relevance…',rows:3,required:false}],

Format:
## Appointment Prep Guide — [Doctor Type]

### Before You Go — Checklist
- [ ] Bring: [list of documents, ID, insurance]

{id:'discharge-explainer',name:'Discharge Summary Explainer',description:'Translates hospital discharge instructions into plain, actionable language.',fields:[{id:'discharge',label:'Discharge Instructions / Summary',type:'textarea',placeholder:'Paste the hospital discharge instructions or summary here…',rows:10,required:true}],

{id:'fitness-plan',name:'Fitness Plan Generator',description:'Builds a structured workout plan tailored to goals, fitness level, and equipment.',fields:[{id:'goal',label:'Fitness Goal',type:'select',options:['Weight loss','Build muscle','General fitness','Improve endurance','Flexibility & mobility','Sports performance','Rehabilitation / low impact'],required:true},{id:'level',label:'Current Fitness Level',type:'select',options:['Beginner (rarely exercise)','Intermediate (exercise 1-2x/week)','Active (3-4x/week)','Advanced (5+ times/week)'],required:true},{id:'equipment',label:'Available Equipment',type:'select',options:['No equipment (bodyweight only)','Basic home (dumbbells, resistance bands)','Home gym','Full gym access'],required:true},{id:'days',label:'Days Per Week',type:'select',options:['2 days','3 days','4 days','5 days','6 days'],required:true},{id:'limitations',label:'Physical Limitations',type:'textarea',placeholder:'Injuries, conditions, or movements to avoid…',rows:2,required:false}],

/* PS Tools API base — configurable. Default :8000; override via ?api=http://host:port (persists in localStorage). */
const _psApiQp=new URLSearchParams(location.search).get('api');
if(_psApiQp)localStorage.setItem('ps_api_base',_psApiQp);
const API_BASE=(_psApiQp||localStorage.getItem('ps_api_base')||'http://localhost:8000').replace(/\/$/,'');
const API_GENERATE=API_BASE+'/generate';
function selectTool(id) {
  const tool = DOMAIN.tools.find(t => t.id === id);
  if (!tool) return;
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.toggle('active', b.dataset.id === id));
  renderTool(tool);
}

function renderTool(tool) {
  const fieldsHtml = tool.fields.map(f => {
    let inp = '';
    if (f.type === 'text')
      inp = `<input type="text" id="f_${f.id}" placeholder="${f.placeholder||''}"${f.required?' required':''}>`;
    else if (f.type === 'textarea')
      inp = `<textarea id="f_${f.id}" placeholder="${f.placeholder||''}" rows="${f.rows||4}"${f.required?' required':''}></textarea><label class="btn-upload"><input type="file" accept=".txt,.pdf,.docx" onchange="handleFileUpload('f_${f.id}',this)">📎 Upload file</label>`;
    else if (f.type === 'select')
      inp = `<select id="f_${f.id}">${f.options.map(o=>`<option>${o}</option>`).join('')}</select>`;
    return `<div class="field-group"><label class="field-label" for="f_${f.id}">${f.label}${f.required?'':' <span class="field-opt">(optional)</span>'}</label>${inp}</div>`;
  }).join('');

  document.getElementById('content').innerHTML = `
    <div class="tool-header">
      <h2 class="tool-name">${tool.name}</h2>
      <p class="tool-desc">${tool.description}</p>
    </div>
    <div class="form-card">
      ${fieldsHtml}
      <button class="btn-gen" onclick="runGenerate('${tool.id}')">Generate</button>
    </div>
    <div class="output-section" id="out-section">
      <div class="output-header"><span class="output-lbl">Output</span><div style="display:flex;gap:6px"><button class="btn-dl" onclick="downloadOut()">↓ Save</button><button class="btn-copy" onclick="copyOut()">Copy</button></div></div>
      <div class="output-box" id="out-box"><div class="out-empty"><div class="out-empty-icon">✨</div><p>Fill in the form and click Generate.</p></div></div>
    </div>`;
}

async function runGenerate(toolId) {
  const tool = DOMAIN.tools.find(t => t.id === toolId);
  if (!tool) return;
  const data = {};
  let ok = true;
  for (const f of tool.fields) {
    const el = document.getElementById(`f_${f.id}`);
    if (!el) continue;
    const v = el.value.trim();
    if (f.required && !v) { el.style.borderColor = '#ef4444'; ok = false; } else { el.style.borderColor = ''; data[f.id] = v; }
  }
  if (!ok) return;

  const outBox = document.getElementById('out-box');
  const btn = document.querySelector('.btn-gen');
  outBox.classList.add('streaming');
  outBox.innerHTML = '<span style="color:var(--muted)">Generating<span class="dots"><span>.</span><span>.</span><span>.</span></span></span>';
  btn.disabled = true; btn.textContent = 'Generating…';

  try {
    const res = await fetch(API_GENERATE, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({system_prompt: tool.systemPrompt, user_message: tool.buildUserMessage(data)})
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const reader = res.body.getReader(); const dec = new TextDecoder(); let out = '';
    outBox.textContent = '';
    while (true) {
      const {done, value} = await reader.read(); if (done) break;
      for (const line of dec.decode(value).split('\n')) {
        if (!line.startsWith('data: ')) continue;
        const d = line.slice(6); if (d === '[DONE]') break;
        try { const p = JSON.parse(d); if (p.error) { outBox.classList.remove('streaming'); outBox.style.color='#ef4444'; outBox.textContent='Error: '+p.error; } else if (p.text) { out += p.text; outBox.textContent = out; outBox.scrollTop = outBox.scrollHeight; } } catch {}
      }
    }
    if (out && typeof marked !== 'undefined') { outBox.classList.remove('streaming'); outBox.innerHTML = marked.parse(out); } else { outBox.classList.remove('streaming'); }
  } catch(e) {
    outBox.classList.remove('streaming');
    outBox.style.color = '#ef4444';
    outBox.textContent = `Connection error: ${e.message}\n\nStart the backend:\n  cd backend\n  uvicorn main:app --reload`;
  }
  btn.disabled = false; btn.textContent = 'Generate';
}

function copyOut() {
  const text = document.getElementById('out-box')?.innerText;
  if (!text || text.includes('Fill in the form')) return;
  navigator.clipboard.writeText(text).then(() => { const b = document.querySelector('.btn-copy'); b.textContent='Copied!'; setTimeout(()=>b.textContent='Copy',2000); });
}

function init() {
  const tools = DOMAIN.tools.filter(t => !t.isAgent);
  const agents = DOMAIN.tools.filter(t => t.isAgent);
  document.getElementById('tool-list').innerHTML =
    `<div class="sidebar-search"><input class="search-inp" type="text" placeholder="Search tools…" oninput="filterTools(this.value)"></div>` +
    `<div class="sec-lbl">Tools · ${tools.length}</div>` +
    tools.map(t=>`<button class="tool-btn" data-id="${t.id}" onclick="selectTool('${t.id}')">${t.name}</button>`).join('') +
    (agents.length ? `<div class="sec-lbl ag">Agents · ${agents.length}</div>` + agents.map(t=>`<button class="tool-btn agent" data-id="${t.id}" onclick="selectTool('${t.id}')">${t.name}</button>`).join('') : '');
  if (tools.length) selectTool(tools[0].id);
}
function filterTools(q) {
  const lq = q.toLowerCase();
  document.querySelectorAll('.tool-btn').forEach(b => {
    b.classList.toggle('hidden', !b.textContent.toLowerCase().includes(lq));
  });
}
function downloadOut() {
  const text = document.getElementById('out-box')?.innerText;
  if (!text || text.includes('Fill in the form')) return;
  const a = document.createElement('a');
  a.href = 'data:text/plain;charset=utf-8,' + encodeURIComponent(text);
  a.download = 'output.txt'; a.click();
}
async function handleFileUpload(fieldId, input) {
  const file = input.files[0]; if (!file) return;
  const ext = file.name.split('.').pop().toLowerCase();
  const ta = document.getElementById(fieldId);
  const prev = ta.placeholder; ta.placeholder = 'Reading file…'; ta.disabled = true;
  try {
    if (ext === 'txt' || ext === 'md' || ext === 'csv') {
      ta.value = await file.text();
    } else if (ext === 'pdf') {
      if (typeof pdfjsLib === 'undefined') { alert('PDF library not loaded yet, please retry.'); ta.disabled = false; ta.placeholder = prev; return; }
      const buf = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({data: new Uint8Array(buf)}).promise;
      let text = '';
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        text += content.items.map(item => item.str).join(' ') + '\n\n';
      }
      ta.value = text.trim();
    } else if (ext === 'docx') {
      if (typeof mammoth === 'undefined') { alert('DOCX library not loaded yet, please retry.'); ta.disabled = false; ta.placeholder = prev; return; }
      const buf = await file.arrayBuffer();
      const result = await mammoth.extractRawText({arrayBuffer: buf});
      ta.value = result.value;
    }
  } catch(e) { alert('Could not read file: ' + e.message); }
  ta.disabled = false; ta.placeholder = prev; input.value = '';
}
window.addEventListener('DOMContentLoaded',init);
</script>
